project:
  source_lang: English
  target_lang: Spanish
  domain_context_max_tokens: 1024
  domain_context: |
    This document is a university-level textbook about the design and
    implementation of the xv6 operating system for the RISC-V architecture.
    
    The intended audience consists of undergraduate and graduate computer
    science students studying operating systems.
    
    Translate using standard technical terminology commonly used in
    Spanish-language computer science literature.
    
    Preserve technical precision, educational clarity, and terminology
    consistency across the entire document.
    
    Do not simplify technical concepts.
    
    Preserve established English terms when they are the accepted form in
    operating systems literature (for example: kernel, spinlock, RISC-V, xv6).
    
    Never translate or modify:
    
    - LaTeX commands
    - code listings
    - mathematical expressions
    - identifiers
    - C symbols
    - assembly mnemonics
    - filenames
    - labels
    - references
    - citations
    
    Translate only natural language intended for the reader.
    
    TERMINOLOGY (EN → preferred Spanish; pick one form and reuse; do not invent synonyms):
    - page fault / page-fault → fallo de página (NEVER "falta de página")
    - page table / PTE → tabla de páginas / PTE
    - trap → trap (never "trampa")
    - exception → excepción; interrupt → interrupción
    - system call → llamada al sistema (API and code names stay English)
    - user space / kernel space → espacio de usuario / espacio del kernel
    - process / thread → proceso / hilo; context switch → cambio de contexto
    - scheduler → scheduler (prefer English over "planificador")
    - lock / locking → lock / bloqueo (never "candado"); spinlock / sleep-lock → keep English
    - deadlock → interbloqueo (deadlock); race condition → condición de carrera
    - pipe → pipe (at most one gloss as "tubería (pipe)")
    - file descriptor → descriptor de archivo; inode / shell → inode / shell
    - sleep / wakeup / lost wake-up → keep English (optional one-time gloss)
    - interrupt handler, top half, bottom half, copy-on-write (COW), buffer cache → keep English
    
    FORBIDDEN calques: "falta de página(s)" for page fault; "trampa" for trap; "candado" for lock.

llm:
  provider: openai
  model: local-model
  base_url: http://localhost:1234/v1
  max_tokens: 8192
  model_context_limit: 16384
  cost_profile: balanced
tm:
  durability: strict
